# Launch arguments for the two GPS units, used by gps.launch.py.
# gps_port      = broadcasts correction data
# gps_starboard = receives corrections, publishes RELPOSNED for heading_node

gps_port:
  namespace: gps_port
  device_family: F9P
  device_serial_string: GPSP
  frame_id: gps_port_link

gps_starboard:
  namespace: gps_starboard
  device_family: F9P
  device_serial_string: GPSB
  frame_id: gps_starboard_link